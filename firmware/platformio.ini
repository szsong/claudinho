; Compilacao com PlatformIO para a Waveshare ESP32-S3-Touch-LCD-1.69
; (as outras placas seguem no compilar.sh, com arduino-cli).
;   cd firmware && pio run -e ws169-s3-v1
[platformio]
src_dir = claudinho

; Base: ESP32-S3R8, 16 MB de flash. O core Arduino 3.x vem da plataforma pioarduino.
[env:ws169-s3]
platform = https://github.com/pioarduino/platform-espressif32/releases/download/55.03.312/platform-espressif32.zip
board = esp32-s3-devkitc-1
framework = arduino
monitor_speed = 115200
board_upload.flash_size = 16MB
board_build.flash_size = 16MB
board_build.partitions = default_16MB.csv
board_build.arduino.memory_type = qio_qspi   ; PSRAM desligada (GPIO33-37 livres)
build_flags =
    -DPLACA_WS169
    -DARDUINO_USB_MODE=1
    -DARDUINO_USB_CDC_ON_BOOT=1
lib_deps =
    https://github.com/lovyan03/LovyanGFX.git#1.2.30
    https://github.com/bblanchon/ArduinoJson.git#v7.4.2

; Primeira revisao da placa: botao PWR, trava de energia e buzzer dividem os
; GPIO33-36 com a PSRAM octal, entao a PSRAM fica desligada (como na base).
[env:ws169-s3-v1]
extends = env:ws169-s3
build_flags =
    ${env:ws169-s3.build_flags}
    -DPLACA_WS169_V1
